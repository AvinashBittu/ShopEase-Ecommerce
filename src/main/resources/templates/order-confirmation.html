<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order Confirmation - ShopEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
	<!-- Navigation Bar -->
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
	    <div class="container">
	        <a class="navbar-brand" href="/">
	            <i class="fas fa-store"></i> ShopEase
	        </a>
	        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
	            <span class="navbar-toggler-icon"></span>
	        </button>
	        <div class="collapse navbar-collapse" id="navbarNav">
	            <ul class="navbar-nav ms-auto">
	                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
	                <li class="nav-item"><a class="nav-link" href="/products/shop">Shop</a></li>
	                <li class="nav-item"><a class="nav-link" href="/cart"><i class="fas fa-shopping-cart"></i> Cart <span id="cartCount" class="badge bg-danger">0</span></a></li>
	                <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
	                <li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li>
	                
	                <!-- Not logged in: Show Login & Register -->
	                <li sec:authorize="isAnonymous()" class="nav-item"><a class="nav-link" href="/login">Login</a></li>
	                <li sec:authorize="isAnonymous()" class="nav-item"><a class="nav-link" href="/register">Register</a></li>
	                
	                <!-- Logged in: Show username & Logout -->
	                <li sec:authorize="isAuthenticated()" class="nav-item dropdown">
	                    <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
	                        <i class="fas fa-user-circle"></i> <span sec:authentication="name"></span>
	                    </a>
	                    <ul class="dropdown-menu">
	                        <li><a class="dropdown-item" href="/orders/my-orders"><i class="fas fa-box"></i> My Orders</a></li>
	                        <li><hr class="dropdown-divider"></li>
	                        <li><a class="dropdown-item" href="/logout"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
	                    </ul>
	                </li>
	            </ul>
	        </div>
	    </div>
	</nav>
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 text-center">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <i class="fas fa-check-circle text-success fa-5x mb-3"></i>
                        <h2 class="mb-3">Order Placed Successfully!</h2>
                        <p class="lead">Thank you for shopping with ShopEase.</p>
                        <p>Your order ID is: <strong>#<span th:text="${orderId}"></span></strong></p>
                        <hr>
                        <p>You will receive a confirmation email shortly.</p>
                        <div class="mt-4">
                            <a href="/orders/my-orders" class="btn btn-primary">View My Orders</a>
                            <a href="/products/shop" class="btn btn-outline-secondary ms-2">Continue Shopping</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
