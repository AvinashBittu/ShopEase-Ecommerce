<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Checkout - ShopEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
   <!-- <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="fas fa-store"></i> ShopEase</a>
        </div>
    </nav>-->
	<!-- Navigation Bar -->
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
	    <div class="container">
	        <a class="navbar-brand" href="/">
	            <i class="fas fa-store"></i> ShopEase
	        </a>
	        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
	            <span class="navbar-toggler-icon"></span>
	        </button>
	        <div class="collapse navbar-collapse" id="navbarNav">
	            <ul class="navbar-nav ms-auto">
	                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
	                <li class="nav-item"><a class="nav-link" href="/products/shop">Shop</a></li>
	                <li class="nav-item"><a class="nav-link" href="/cart"><i class="fas fa-shopping-cart"></i> Cart <span id="cartCount" class="badge bg-danger">0</span></a></li>
	                <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
	                <li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li>
	                
	                <!-- Not logged in: Show Login & Register -->
	                <li sec:authorize="isAnonymous()" class="nav-item"><a class="nav-link" href="/login">Login</a></li>
	                <li sec:authorize="isAnonymous()" class="nav-item"><a class="nav-link" href="/register">Register</a></li>
	                
	                <!-- Logged in: Show username & Logout -->
	                <li sec:authorize="isAuthenticated()" class="nav-item dropdown">
	                    <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
	                        <i class="fas fa-user-circle"></i> <span sec:authentication="name"></span>
	                    </a>
	                    <ul class="dropdown-menu">
	                        <li><a class="dropdown-item" href="/orders/my-orders"><i class="fas fa-box"></i> My Orders</a></li>
	                        <li><hr class="dropdown-divider"></li>
	                        <li><a class="dropdown-item" href="/logout"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
	                    </ul>
	                </li>
	            </ul>
	        </div>
	    </div>
	</nav>

    <div class="container my-5">
        <h2 class="mb-4"><i class="fas fa-credit-card"></i> Checkout</h2>

        <div class="row">
            <div class="col-md-7">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Delivery Address</h5>
                        <form th:action="@{/orders/place}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Full Name</label>
                                <input type="text" class="form-control" required placeholder="Enter your name">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Address *</label>
                                <textarea name="address" class="form-control" rows="3" required placeholder="Enter your complete delivery address"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Phone Number</label>
                                <input type="tel" class="form-control" placeholder="Enter your phone number">
                            </div>
                            <button type="submit" class="btn btn-success btn-lg w-100">Place Order</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-5">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Order Summary</h5>
                        <hr>
                        <div class="text-muted mb-2">
                            <p class="mb-1">You have <strong th:text="${cartSize}"></strong> item(s) in your cart</p>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between">
                            <span>Payment Method:</span>
                            <span><strong>Cash on Delivery</strong></span>
                        </div>
                        <div class="alert alert-info mt-3 small">
                            <i class="fas fa-info-circle"></i> You will pay cash when the product is delivered.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
