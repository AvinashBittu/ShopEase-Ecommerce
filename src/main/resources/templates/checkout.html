<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<title>Checkout - ShopEase</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

	<!-- OpenStreetMap CSS -->
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
	
</head>
<body>
	<!-- <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="fas fa-store"></i> ShopEase</a>
        </div>
    </nav>-->
	<!-- Navigation Bar -->
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
		<div class="container">
			<a class="navbar-brand" href="/">
				<i class="fas fa-store"></i> ShopEase
			</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav ms-auto">
					<li class="nav-item"><a class="nav-link" href="/">Home</a></li>
					<li class="nav-item"><a class="nav-link" href="/products/shop">Shop</a></li>
					<li class="nav-item"><a class="nav-link" href="/cart"><i class="fas fa-shopping-cart"></i> Cart
							<span id="cartCount" class="badge bg-danger">0</span></a></li>
					<li class="nav-item"><a class="nav-link" href="/about">About</a></li>
					<li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li>

					<!-- Not logged in: Show Login & Register -->
					<li sec:authorize="isAnonymous()" class="nav-item"><a class="nav-link" href="/login">Login</a></li>
					<li sec:authorize="isAnonymous()" class="nav-item"><a class="nav-link" href="/register">Register</a>
					</li>

					<!-- Logged in: Show username & Logout -->
					<li sec:authorize="isAuthenticated()" class="nav-item dropdown">
						<a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
							data-bs-toggle="dropdown">
							<i class="fas fa-user-circle"></i> <span sec:authentication="name"></span>
						</a>
						<ul class="dropdown-menu">
							<li><a class="dropdown-item" href="/orders/my-orders"><i class="fas fa-box"></i> My
									Orders</a></li>
							<li>
								<hr class="dropdown-divider">
							</li>
							<li><a class="dropdown-item" href="/logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
							</li>
						</ul>
					</li>
				</ul>
			</div>
		</div>
	</nav>

	<div class="container my-5">
		<h2 class="mb-4"><i class="fas fa-credit-card"></i> Checkout</h2>

		<div class="row">
			<div class="col-md-7">
				<div class="card">
					<div class="card-body">
						<h5 class="card-title">Delivery Address</h5>
						<form th:action="@{/orders/place}" method="post">
							<div class="mb-3">
								<label class="form-label">Full Name</label>
								<input type="text" class="form-control" required placeholder="Enter your name">
							</div>

							<div class="mb-3">
								<label class="form-label">Address *</label>
								<textarea id="address" name="address" class="form-control" rows="3" required
									placeholder="Enter your complete delivery address"></textarea>
							</div>
							<div class="mb-3">
								<label class="form-label">Phone Number</label>
								<input type="tel" class="form-control" placeholder="Enter your phone number">
							</div>

							<!--Start Of Location Related changes using fields -->
							<div class="mb-3">
								<label class="form-label">Landmark (Optional)</label>
								<input type="text" name="landmark" class="form-control"
									placeholder="e.g. Near City Mall, Opposite Park">
							</div>

							<div class="mb-3">
								<label class="form-label">Delivery Instructions (Optional)</label>
								<textarea name="deliveryInstructions" class="form-control" rows="2"
									placeholder="Any special instructions for delivery person"></textarea>
							</div>
							<!--End Of Location Related chnages using fields -->

							<!-- Start: OpenStreetMap Location -->
							<div class="mb-3">
							    <label class="form-label fw-bold">📍 Select Your Delivery Location</label>
							    <div id="map" style="height: 280px; width: 100%; border-radius: 8px; border: 1px solid #ced4da;"></div>
							    <small class="text-muted">Click on the map to select your exact delivery location</small>
							</div>

							<!-- Hidden fields for latitude/longitude -->
							<input type="hidden" id="latitude" name="latitude" value="">
							<input type="hidden" id="longitude" name="longitude" value="">

							<!-- Selected Location Display (Address) -->
							<div id="selectedLocation" class="alert alert-success mt-2 py-2" style="display: none; font-size: 0.95rem;">
							    📍 <span id="locationAddress">Address fetched from map...</span>
							</div>
							<!-- End: OpenStreetMap Location -->
							
							
							
							   <div class="mb-3">
							        <label class="form-label fw-bold">Payment Method</label>
							        <select class="form-select" name="paymentMethod" required>
							            <option value="COD">Cash on Delivery</option>
							            <option value="ONLINE">Online Payment (Card/UPI)</option>
							        </select>
							    </div>

							
							<button type="submit" class="btn btn-success btn-lg w-100">Place Order</button>
						</form>
					</div>
				</div>
			</div>

			<div class="col-md-5">
				<div class="card">
					<div class="card-body">
						<h5 class="card-title">Order Summary</h5>
						<hr>
						<div class="text-muted mb-2">
							<p class="mb-1">You have <strong th:text="${cartSize}"></strong> item(s) in your cart</p>
						</div>
						<hr>
						
						
					
					</div>
				</div>
			</div>
		</div>
	</div>
	
	<!-- OpenStreetMap JS -->
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
	<!-- OpenStreetMap JavaScript -->
	<script>
	document.addEventListener('DOMContentLoaded', function() {

	    // Check if map container exists
	    var mapContainer = document.getElementById('map');
	    if (!mapContainer) {
	        console.error('Map container not found!');
	        return;
	    }

	    // Initialize map
	    var map = L.map('map').setView([20.5937, 78.9629], 5);
	    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
	        attribution: '© OpenStreetMap'
	    }).addTo(map);

	    var marker;
	    var selectedLocationDiv = document.getElementById('selectedLocation');
	    var locationAddressSpan = document.getElementById('locationAddress');

	    // Click event on map
	    map.on('click', function(e) {
	        var lat = e.latlng.lat;
	        var lng = e.latlng.lng;

	        // Set hidden fields
	        document.getElementById('latitude').value = lat;
	        document.getElementById('longitude').value = lng;

	        // Add or move marker
	        if (marker) {
	            marker.setLatLng(e.latlng);
	        } else {
	            marker = L.marker(e.latlng).addTo(map);
	        }

	        // Show fetching message
	        selectedLocationDiv.style.display = 'block';
	        locationAddressSpan.textContent = 'Fetching address...';

	        // Reverse geocoding to get address
	        fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
	            .then(response => response.json())
	            .then(data => {
	                if (data.display_name) {
	                    // Show full address 
	                    var fullAddress = data.display_name;
	                    locationAddressSpan.textContent = fullAddress;

	                    var addressTextarea = document.querySelector('textarea[name="address"]');
	                    if (addressTextarea) {
	                        addressTextarea.value = fullAddress;
	                       
	                        addressTextarea.dispatchEvent(new Event('input'));
	                    }

	                    var pincode = '';
	                    if (data.address && data.address.postcode) {
	                        pincode = data.address.postcode;
	                        console.log('Pincode found:', pincode);
	                    } else {
	                        console.log('Pincode not found in response');
	                    }
	                } else {
	                    locationAddressSpan.textContent = `${lat.toFixed(6)}, ${lng.toFixed(6)} (Address not found)`;
	                }
	            })
	            .catch(error => {
	                console.log('Geocoding error:', error);
	                locationAddressSpan.textContent = `${lat.toFixed(6)}, ${lng.toFixed(6)} (Location selected)`;
	            });
	    });
	});
	
	</script>
	
</body>

</html>
