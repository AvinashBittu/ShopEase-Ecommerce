<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Payment - ShopEase</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body text-center">
                        <h3 class="mb-4"><i class="fas fa-credit-card"></i> Complete Payment</h3>
                        <hr>
                        <p><strong>Order ID:</strong> <span th:text="${orderId}"></span></p>
                        <p><strong>Amount:</strong> <span class="text-success fw-bold fs-5">₹<span th:text="${total}"></span></span></p>
                        <hr>
                        <button id="payNowBtn" class="btn btn-primary btn-lg w-100">
                            <i class="fas fa-lock"></i> Pay Now ₹<span th:text="${total}"></span>
                        </button>
                        <div id="errorMessage" class="alert alert-danger mt-3" style="display:none;"></div>
                        <a href="/cart" class="btn btn-link mt-3">Cancel Payment</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        var options = {
            "key": "[[${razorpayKey}]]",
            "order_id": "[[${razorpayOrderId}]]",
            "handler": function (response) {
                // Payment success
                window.location.href = "/orders/confirmation/" + [[${orderId}]];
            },
            "modal": {
                "ondismiss": function() {
                    // Payment cancelled
                    window.location.href = "/cart";
                }
            }
        };

        document.getElementById("payNowBtn").onclick = function() {
            var rzp = new Razorpay(options);
            rzp.open();
        };
    </script>
</body>
</html>
