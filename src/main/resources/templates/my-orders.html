<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>My Orders - ShopEase</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<style>
		.status-badge {
			padding: 5px 12px;
			border-radius: 20px;
			font-size: 0.8rem;
			font-weight: bold;
		}

		.status-PENDING {
			background-color: #ffc107;
			color: #000;
		}

		.status-PROCESSING {
			background-color: #17a2b8;
			color: #fff;
		}

		.status-SHIPPED {
			background-color: #007bff;
			color: #fff;
		}

		.status-DELIVERED {
			background-color: #28a745;
			color: #fff;
		}

		.status-CANCELLED {
			background-color: #dc3545;
			color: #fff;
		}

		.order-card {
			transition: transform 0.2s;
			margin-bottom: 20px;
		}

		.order-card:hover {
			transform: translateY(-2px);
			box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
		}
	</style>
</head>

<body>

	<!-- Navigation Bar -->
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
		<div class="container">
			<a class="navbar-brand" href="/">
				<i class="fas fa-store"></i> ShopEase
			</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav ms-auto">
					<li class="nav-item"><a class="nav-link" href="/">Home</a></li>
					<li class="nav-item"><a class="nav-link" href="/products/shop">Shop</a></li>
					<li class="nav-item"><a class="nav-link" href="/cart"><i class="fas fa-shopping-cart"></i> Cart
							<span id="cartCount" class="badge bg-danger">0</span></a></li>
					<li class="nav-item"><a class="nav-link" href="/about">About</a></li>
					<li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li>

					<!-- Not logged in: Show Login & Register -->
					<li sec:authorize="isAnonymous()" class="nav-item"><a class="nav-link" href="/login">Login</a></li>
					<li sec:authorize="isAnonymous()" class="nav-item"><a class="nav-link" href="/register">Register</a>
					</li>

					<!-- Logged in: Show username & Logout -->
					<li sec:authorize="isAuthenticated()" class="nav-item dropdown">
						<a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
							data-bs-toggle="dropdown">
							<i class="fas fa-user-circle"></i> <span sec:authentication="name"></span>
						</a>
						<ul class="dropdown-menu">
							<li><a class="dropdown-item" href="/orders/my-orders"><i class="fas fa-box"></i> My
									Orders</a></li>
							<li>
								<hr class="dropdown-divider">
							</li>
							<li><a class="dropdown-item" href="/logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
							</li>
						</ul>
					</li>
				</ul>
			</div>
		</div>
	</nav>

	<div class="container my-5">
		<h2 class="mb-4"><i class="fas fa-box"></i> My Orders</h2>

		<!-- No Orders -->
		<div class="alert alert-info text-center" th:if="${#lists.isEmpty(orders)}">
			<i class="fas fa-shopping-bag fa-3x mb-2"></i>
			<h5>No orders yet!</h5>
			<p>Start shopping to see your orders here.</p>
			<a href="/products/shop" class="btn btn-primary">Start Shopping</a>
		</div>

		<!-- Orders List -->
		<div th:if="${not #lists.isEmpty(orders)}">
			<div class="row" th:each="order : ${orders}">
				<div class="col-12 mb-4">
					<div class="card order-card">
						<div class="card-header bg-light">
							<div class="row align-items-center">
								<div class="col-md-4">
									<strong>Order #<span th:text="${order.id}"></span></strong>
								</div>
								<div class="col-md-4 text-center">
									<span th:class="'status-badge status-' + ${order.status}"
										th:text="${order.status}"></span>
								</div>
								<div class="col-md-4 text-end">
									<small class="text-muted"
										th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy, hh:mm a')}"></small>
								</div>
							</div>
						</div>
						<div class="card-body">
							<div class="row mb-3">
								<div class="col-md-6">
									<p class="mb-1"><strong>Total Amount:</strong> <span
											class="text-success fw-bold fs-5">₹<span
												th:text="${order.totalAmount}"></span></span></p>
								</div>
								<div class="col-md-6">
									<p class="mb-1"><strong>Delivery Address:</strong> <span
											th:text="${order.deliveryAddress}"></span></p>
								</div>
							</div>
							<hr>
							<h6>Items:</h6>
							<div class="table-responsive">
								<table class="table table-sm">
									<thead>
										<tr>
											<th>Product</th>
											<th>Quantity</th>
											<th>Price</th>
											<th>Total</th>
										</tr>
									</thead>
									<tbody>
										<tr th:each="item : ${order.items}">
											<td th:text="${item.product.name}">Product Name</td>
											<td th:text="${item.quantity}">1</td>
											<td>₹<span th:text="${item.price}"></span></td>
											<td>₹<span th:text="${item.price * item.quantity}"></span></td>
										</tr>
									</tbody>
								</table>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script>
		$(document).ready(function () {
			$.get("/cart/count", function (data) {
				$("#cartCount").text(data);
			});
		});
	</script>
</body>

</html>
